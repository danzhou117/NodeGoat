[build-system]
requires = ["hatchling>=1.33,<2"]
build-backend = "hatchling.build"

[project]
name = "nodegoat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1,<1",
    "uvicorn>=0.54,<1",
    "pymongo>=4.20,<5",
    "jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "httpx2>=2.16.2,<3",
    "hatchling>=1.33,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["nodegoat"]

[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
