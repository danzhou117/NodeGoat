[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "nodegoat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1,<1",
    "uvicorn>=0.54,<1",
    "pymongo>=4.20,<5",
    "jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "httpx2>=2.16.2,<3",
]

[tool.setuptools.packages.find]
include = ["nodegoat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
